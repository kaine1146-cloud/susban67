name: SusBan
version: '${version}'
main: com.susban.SusBan
api-version: '1.21'
description: Owner-only /sus (list players) and /ban (player, time, reason).
commands:
  sus:
    description: List every player online (owner only)
    usage: /sus
    permission: susban.owner
  ban:
    description: Ban a player with a time and reason (owner only)
    usage: /ban <player> <time|perm> <reason...>
    permission: susban.owner
permissions:
  susban.owner:
    description: Placeholder permission so the commands stay hidden from everyone else
    default: false
